[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lynxpath"
version = "0.1.0"
description = "Open capacity signals and explainable time-to-care estimation for synthetic emergency-routing research."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [{name = "LynxPath contributors"}]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Medical Science Apps."
]
dependencies = [
  "streamlit>=1.50,<2",
  "pandas>=2.1,<3",
  "jsonschema>=4.22,<5"
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[tool.setuptools]
packages = ["lynxpath"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
